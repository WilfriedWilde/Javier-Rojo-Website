<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="instagram.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:ital,wght@0,100;0,300;0,400;0,500;0,700;0,800;0,900;1,100;1,300;1,400;1,500;1,700;1,800;1,900&family=Mukta+Vaani:wght@200;300;400;500;600;700;800&family=Overlock:ital,wght@0,400;0,700;0,900;1,400;1,700;1,900&display=swap"
        rel="stylesheet">
    <title>Javier Rojo - Homepage</title>
</head>

<body data-barba="wrapper">
    <navbar id="navbar"></navbar>
    <div data-barba="container" data-namespace="index">
        <main id="main-home" class="main">
            <img id="home-image-background" src="./images/javi/stairs_below_RESIZED.webp" class="home-image">
            <div id="home-image-overlay"></div>
            <img id="home-image-foreground" src="./images/javi/stairs_below_NO_BACKGROUND.png" class="home-image">
            <div id="home-title-container">
                <div id="home-title-wrapper">
                    <p id="title-javier" class="home-title">javier</p>
                    <p id="title-rojo" class="home-title">rojo</p>
                </div>
                <div id="home-click-wrapper">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 100" class="click">
                        <path
                            d="M55.53,37.36a102.56,102.56,0,0,1-.06,21.31q43.85-3.49,87.87-3.37c8.7,0,17.41.16,26.09-.37,9.15-.55,18.24-1.84,27.37-2.77a362.18,362.18,0,0,1,48.85-1.71A40.54,40.54,0,0,0,230,40.26a92.43,92.43,0,0,0,15.71,11.3,37.18,37.18,0,0,0-13.11,12" />
                    </svg>
                    <p id="click-text">Click to enter.</p>
                </div>
            </div>
            <div id="smooth-wrapper">
                <div id="smooth-content">
                </div>
            </div>
        </main>
    </div>
    <footer id="footer"></footer>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/DrawSVGPlugin.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollSmoother.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/SplitText.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/TextPlugin.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@barba/core@2.10.0"></script>
    <script src="./js/main.js" type="module"></script>
</body>

</html>
